{% extends "base.html" %}
{% block title %}Join Event{% endblock %}
{% block content %}
<div class="form-page"><div class="form-card">
<span class="badge">VOLUNTEER</span><h1>Join an Event</h1>
<p class="muted">Enter the event code given by your coordinator.</p>
<form method="POST" action="/join">
<label>Event Code</label><input type="text" name="event_code" placeholder="HF-ABC123" required maxlength="9">
<button type="submit" class="button primary full">Join Event</button>
</form>
</div></div>
{% endblock %}
