{% extends "base.html" %}
{% block title %}Create Event{% endblock %}
{% block content %}
<div class="form-page"><div class="form-card">
<span class="badge">COORDINATOR</span><h1>Create an Event</h1>
<p class="muted">Set up your event and start coordinating.</p>
<form method="POST" action="/create-event">
<label>Event Name</label><input type="text" name="name" placeholder="EDGE 2026" required>
<label>Description</label><textarea name="description" placeholder="Describe your event..."></textarea>
<label>Venue</label><input type="text" name="venue" placeholder="Main Auditorium">
<div class="two-column"><div><label>Date</label><input type="date" name="date" required></div>
<div><label>Start Time</label><input type="time" name="start_time" required></div></div>
<label>End Time</label><input type="time" name="end_time" required>
<button type="submit" class="button primary full">Create Event</button>
</form>
</div></div>
{% endblock %}
