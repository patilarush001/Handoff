[project]
name = "handoff"
version = "0.1.0"
description = "Event operations and volunteer coordination platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "psycopg[binary]",
    "jinja2",
    "python-dotenv",
    "python-multipart"
]

[tool.vercel]
entrypoint = "app.main:app"
